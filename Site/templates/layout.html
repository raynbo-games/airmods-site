<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Raynbo Games</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" type="text/css" href="/static/content/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/static/content/site.css" />
    <script src="/static/scripts/modernizr-2.6.2.js"></script>
</head>

<body>
    <div class="navbar navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a href="/" class="navbar-brand">Raynbo Games</a>
            </div>
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav">
                    <li><a href="{{ url_for('root.about') }}">About</a></li>
                    <li><a href="{{ url_for('airspy.root') }}">Airspy</a></li>
                    <li><a href="{{ url_for('airmods.root') }}">Airmods</a></li>
                </ul>
                {% if request.blueprint == 'airspy' %}
                <div class="search-wrapper">
                    <div class="search-container">
                        <input type="text" id="search-input" autocomplete="off" placeholder="Search...">
                        <div id="suggestions" class="suggestions-box"></div>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="container body-content">
        {% block content %}{% endblock %}
        <hr />
        <footer>
            <div class="centered-content">
                <p>&copy; {{ year }} - Raynbo Games</p>
            </div>
            <div class="centered-content">
                <p>
                    <a href="/privacy">Privacy Policy</a>
                    |
                    <a href="/tos">Terms of Service</a>
                </p>
            </div>
        </footer>
    </div>

    <script src="/static/scripts/jquery-1.10.2.js"></script>
    <script src="/static/scripts/bootstrap.js"></script>
    <script src="/static/scripts/respond.js"></script>
    {% if request.blueprint == 'airspy' %}
    <script src="{{ url_for('static', filename='scripts/search.js') }}"></script>
    {% endif %}
    {% block scripts %}{% endblock %}
</body>
</html>
