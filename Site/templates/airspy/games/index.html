{% extends "layout.html" %}

{% block head %}
<link rel="stylesheet" type="text/css" href="{{ cdn_style('grid') }}" />
{% endblock %}

{% block content %}

<h1>Airship Games</h1>

<div class="grid-wrapper">
    <div class="grid">
        {% for game in games %}
        <a href="{{ game.url }}" class="card" rel="noopener noreferrer">
            <img src="{{ game.image_url }}" alt="{{ game.name }}">
            <span>{{ game.name }}</span>
        </a>
        {% endfor %}
    </div>
</div>

{% endblock %}
