{% extends "layout.html" %}

{% block content %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            gap: 40px;
            padding: 40px;
        }

        .search-container {
            position: relative;
            width: 300px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Autofill dropdown styling */
        .suggestions-box {
            position: absolute;
            width: 100%;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 10;
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
        }

            .suggestion-item:hover {
                background-color: #f0f0f0;
            }

        /* Preview container styling */
        .preview-pane {
            border: 1px dashed #aaa;
            padding: 20px;
            width: 300px;
            min-height: 150px;
            background: #fafafa;
        }
    </style>
</head>
<body>

    <div>
        <h2>Search</h2>
        <div class="search-container">
            <!-- Autocomplete attribute turned off to stop standard browser default history menus -->
            <input type="text" id="search-input" autocomplete="off" placeholder="Type to search modules...">
            <div id="suggestions" class="suggestions-box"></div>
        </div>
    </div>

    <!-- Live Preview panel block -->
    <div>
        <h2>Live Preview</h2>
        <div id="preview" class="preview-pane">
            <p style="color: #777;">Select an item from suggestions to display full preview details here.</p>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const suggestionsBox = document.getElementById('suggestions');
        const previewPane = document.getElementById('preview');

        // 1. The reusable Debounce function wrapper
        function debounce(func, delay) {
            let timeoutId;
            return function (...args) {
                // Cancel the previous pending network call execution timer
                if (timeoutId) {
                    clearTimeout(timeoutId);
                }
                // Start a fresh countdown timer
                timeoutId = setTimeout(() => {
                    func.apply(this, args);
                }, delay);
            };
        }

        // 2. The core search task logic pulled out into its own function
        async function performSearch() {
            const query = searchInput.value.trim();

            if (query.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            try {
                // Fetch dynamic text matching results from Flask route
                const response = await fetch(`/airspy/api/search?q=${encodeURIComponent(query)}`);
                const matches = await response.json();

                renderSuggestions(matches);
            } catch (err) {
                console.error("Error retrieving search data:", err);
            }
        }

        // 3. Attach the debounced version (300ms delay) to the typing event
        searchInput.addEventListener('input', debounce(performSearch, 300));

        // 4. Render UI elements dropdown and autofill
        function renderSuggestions(matches) {
            suggestionsBox.innerHTML = '';

            if (matches.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.title;

                // Handle click selections
                div.addEventListener('click', () => {
                    searchInput.value = item.title; // Autofill search box string
                    suggestionsBox.style.display = 'none'; // Clear dropdown menu list

                    // Render Live Preview template information
                    previewPane.innerHTML = `<a href="${item.url}">${item.title.slice(6)}</a>`;
                });

                suggestionsBox.appendChild(div);
            });

            suggestionsBox.style.display = 'block';
        }

        // Close dropdown instantly if clicking outside search box components
        document.addEventListener('click', function (e) {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });
    </script>

</body>
</html>



{% endblock %}
