{% extends "layout.html" %}

{% block content %}

<h1>Users</h1>

<div class="list-card">
    {% for user_data in data %}
    <a href="{{ url_for('admin.user', user_id=user_data.id) }}" class="list-card-item">
        <span>{{ user_data.username }}</span>
        <span class="list-card-arrow">&#8594;</span>
    </a>
    {% endfor %}
</div>

{% endblock %}
