{% extends "layout.html" %}

{% block head %}
<link rel="stylesheet" type="text/css" href="{{ cdn_style('grid') }}" />
{% endblock %}

{% block content %}

<h1>Users</h1>
<div class="grid-wrapper">
    <div class="grid">
        {% for user_data in data %}
        <a href="{{ url_for('admin.user', user_id=user_data.id) }}" class="card" rel="noopener noreferrer">
            <span>{{ user_data.username }}</span>
        </a>
        {% endfor %}
    </div>
</div>

{% endblock %}
