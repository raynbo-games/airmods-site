{% extends "layout.html" %}
{% block content %}
<div class="container" style="max-width: 500px; margin-top: 50px;">
    <h2 style="margin-bottom: 20px; font-weight: 300;">Choose a Username</h2>

    <form method="POST" action="{{ url_for('auth.create', next=next_url) }}">
        <div class="form-group">
            <div class="input-group">
                <input type="text" id="username" name="username" class="form-control input-lg" placeholder="Enter username..." autocomplete="off" required>

                <span class="input-group-btn">
                    <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" disabled>Create Account</button>
                </span>
            </div>

            <div id="feedback" style="margin-top: 10px; font-weight: 500;"></div>
        </div>
    </form>
</div>

<script>
    const usernameInput = document.getElementById('username');
    const feedbackDiv = document.getElementById('feedback');
    const submitBtn = document.getElementById('submit-btn');
    let debounceTimer;

    usernameInput.addEventListener('input', () => {
        const username = usernameInput.value.trim();

        if (username.length === 0) {
            feedbackDiv.textContent = '';
            submitBtn.disabled = true;
            return;
        }

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            fetch(`/auth/create/verify?username=${encodeURIComponent(username)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.valid) {
                        feedbackDiv.textContent = data.message;
                        feedbackDiv.className = 'success';
                        submitBtn.disabled = false;
                    } else {
                        feedbackDiv.textContent = data.message;
                        feedbackDiv.className = 'error';
                        submitBtn.disabled = true;
                    }
                })
                .catch(err => {
                    console.error('Error verifying username:', err);
                    feedbackDiv.textContent = 'Server verification failed. Please try again.';
                    feedbackDiv.className = 'error';
                    submitBtn.disabled = true;
                });

        }, 300);
    });</script>
{% endblock %}
