{% extends "layout.html" %}

{% block head %}
<link rel="stylesheet" type="text/css" href="/static/content/grid.css" />
{% endblock %}

{% block content %}

<h1>Welcome to Raynbo Games!</h1>

<div class="grid-wrapper">
    <div class="grid">
        <a href="{{ url_for('root.about') }}" class="card" rel="noopener noreferrer">
            <span>About</span>
        </a>
        <a href="{{ url_for('airspy.root') }}" class="card" rel="noopener noreferrer">
            <span>Airspy</span>
        </a>
        <a href="{{ url_for('airmods.root') }}" class="card" rel="noopener noreferrer">
            <span>Airmods</span>
        </a>
        {% if user and user.auth and user.auth >= 1 %}
        <a href="{{ url_for('admin.root') }}" class="card" rel="noopener noreferrer">
            <span>Admin</span>
        </a>
        {% endif %}
    </div>
</div>

{% endblock %}
